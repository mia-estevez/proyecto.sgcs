<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <title>Recursos y Aprendizaje</title>
</head>

<body>

    <!-- NAVBAR -->
    <div id="navbar"></div>

    <main>

        <!-- GLOSARIO -->
        <section class="vista-agil" id="vista-glosario">

            <h1>GLOSARIO</h1>

            <p>
                Encontrá definiciones de los términos más importantes
                relacionados con las metodologías ágiles, la calidad
                del software y su desarrollo.
            </p>

            <div class="buscador-glosario">

                <i class="fa-solid fa-magnifying-glass"
                aria-hidden="true"></i>

                <input type="search"
                    id="busqueda-glosario"
                    placeholder="Buscar término..."
                    aria-label="Buscar término en el glosario"
                    autocomplete="off">

                <button type="button"
                        id="limpiar-glosario"
                        aria-label="Limpiar búsqueda">

                    <i class="fa-solid fa-xmark"
                    aria-hidden="true"></i>
                </button>

            </div>

            <nav class="filtros-glosario"
                id="filtros-glosario"
                aria-label="Filtrar términos por letra">

                <button type="button"
                        class="filtro-letra activo"
                        data-letra="todos"
                        aria-pressed="true">
                    Todos
                </button>

            </nav>

            <div class="lista-glosario"
                id="lista-glosario"
                aria-live="polite">
            </div>

            <nav class="paginacion-glosario"
                id="paginacion-glosario"
                aria-label="Páginas del glosario">
            </nav>

        </section>


    </main>


    <!-- FOOTER -->
    <div id="footer"></div>


    <script src="../js/script.js"></script>

</body>

</html>
